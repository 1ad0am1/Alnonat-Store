<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم النون</title><link rel="stylesheet" href="/styles.css"><style>body{background:#fff0f6}.admin-wrap{max-width:900px;margin:35px auto;padding:0 15px}.admin-box{background:#fff;border:1px solid #f3c6d8;border-radius:22px;padding:25px;box-shadow:0 10px 30px #d65a8915}.admin-box h1{color:#f52f78;text-align:center}.admin-box input,.admin-box textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #f1c5d6;border-radius:12px;font:inherit}.admin-list{margin-top:25px}.admin-item{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px;border-bottom:1px solid #eee}.admin-item img{width:65px;height:65px;object-fit:cover;border-radius:12px}.danger{border:0;background:#fee;color:#c22;padding:8px 14px;border-radius:10px;cursor:pointer}</style></head><body><div class="admin-wrap"><div class="admin-box"><h1>النون STORE — لوحة التحكم</h1><p>كلمة المرور الافتراضية: <b>123456</b></p><input id="pass" type="password" placeholder="كلمة مرور الإدارة"><form id="productForm"><input name="id" placeholder="معرّف المنتج (اختياري)"><input name="name" placeholder="اسم المنتج" required><input name="price" type="number" placeholder="السعر" required><input name="bundleQty" type="number" value="2" placeholder="عدد العرض"><input name="bundlePrice" type="number" placeholder="سعر العرض"><input name="badge" placeholder="شارة المنتج"><textarea name="description" placeholder="وصف المنتج"></textarea><label class="file-label">صورة المنتج <input name="image" type="file" accept="image/*"></label><button class="primary-btn full">حفظ المنتج</button></form><div id="msg"></div><div id="adminList" class="admin-list"></div></div></div><script src="/admin.js"></script></body></html>
