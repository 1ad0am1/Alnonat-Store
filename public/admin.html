<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة متجر النون</title><link rel="stylesheet" href="/styles.css"></head><body><main class="products-section"><div class="section-title"><h2>لوحة إدارة متجر النون</h2></div><div class="modal-card" style="margin:auto"><p class="muted">من هنا تضيف وتعدّل المنتجات. كلمة مرور الإدارة يتم تحديدها من متغير ADMIN_PASSWORD على الاستضافة.</p><input id="pass" type="password" placeholder="كلمة مرور الإدارة"><form id="productForm"><input name="id" placeholder="معرّف المنتج (اختياري)"><input name="name" placeholder="اسم المنتج" required><input name="price" type="number" placeholder="السعر" required><input name="bundleQty" type="number" value="2" placeholder="عدد العرض"><input name="bundlePrice" type="number" placeholder="سعر العرض (مثال 700)"><input name="badge" placeholder="شارة المنتج (اختياري)"><textarea name="description" placeholder="شرح المنتج بالتفصيل: المنتج عبارة عن إيه، المقاس، العدد، الخامات، وطريقة الاستخدام..."></textarea><label style="display:block;margin-top:10px;font-weight:700">صور المنتج</label><input id="imageFiles" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple style="display:none"><label for="imageFiles" class="primary-btn full" style="display:block;text-align:center;cursor:pointer;margin-top:8px">📷 اختيار الصور من الجهاز</label><button id="uploadBtn" type="button" class="secondary-btn full" style="margin-top:8px">⬆️ رفع الصور للموقع</button><p class="muted">اختار صورة أو أكثر من الكمبيوتر أو الموبايل، ثم اضغط «رفع الصور للموقع». حتى 12 صورة، 2 ميجابايت للصورة.</p><div id="uploadStatus" class="muted"></div><div id="imagePreview" style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0"></div><textarea name="images" placeholder="روابط الصور التي تم رفعها ستظهر هنا" required></textarea><button class="primary-btn full">حفظ المنتج</button></form><hr><div id="adminList"></div></div></main><script src="/admin.js"></script></body></html>
