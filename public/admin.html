<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة متجر النون</title><link rel="stylesheet" href="/styles.css"></head><body><main class="products-section"><div class="section-title"><h2>لوحة إدارة متجر النون</h2></div><div class="modal-card" style="margin:auto"><p class="muted">من هنا تضيف وتعدّل المنتجات. كلمة المرور الافتراضية: <b>123456</b> — غيّرها على الاستضافة من متغير ADMIN_PASSWORD.</p><input id="pass" type="password" placeholder="كلمة مرور الإدارة"><form id="productForm"><input name="id" placeholder="معرّف المنتج (اختياري)"><input name="name" placeholder="اسم المنتج" required><input name="price" type="number" placeholder="السعر" required><input name="bundleQty" type="number" value="2" placeholder="عدد العرض"><input name="bundlePrice" type="number" placeholder="سعر العرض (مثال 700)"><input name="badge" placeholder="شارة المنتج (اختياري)"><textarea name="description" placeholder="وصف المنتج"></textarea><input name="image" placeholder="رابط صورة المنتج (مثال: /uploads/teddy-bear.jpg)" required><p class="muted">للصور الموجودة داخل الموقع استخدم مثلًا: /uploads/sketch-15-sheets.jpg</p><button class="primary-btn full">حفظ المنتج</button></form><hr><div id="adminList"></div></div></main><script src="/admin.js"></script></body></html>
